[package]
name = "sigmaos-timeshift"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "System snapshot and restore tool"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-timeshift"
readme = "README.md"
keywords = ["snapshot", "restore", "timeshift"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }
sigmaos-filesystem = { version = "0.1", path = "../SigmaOS-filesystem" }

[profile.release]
opt-level = 3
